; The ready firmware for plug-and-play use: MyDesktopWidget draws one of its skins on the screen.
;
;   pio run -t upload
;
; Built for the Cheap Yellow Display with the ILI9341 panel (board profile cyd-2432s028r). For the
; ST7789 panel, swap the display lines for the ones in extras/boards/README.md. Reading the board
; profile at start-up, so one build serves every board, is the next step.
; SPDX-License-Identifier: MIT

[env:cyd-2432s028r]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
lib_deps =
  symlink://../..
  bblanchon/ArduinoJson@^7.4.0
  bodmer/TFT_eSPI@^2.5.43
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
